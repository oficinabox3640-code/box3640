<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOX3640 - Oficina de Motas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: #000;
    }

    h1 {
      color: #e30613;
      font-size: 3rem;
      margin: 0;
    }

    p {
      font-size: 1.2rem;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      background: #1c1c1c;
      margin: 10px;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      width: 250px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #e30613;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>BOX3640</h1>
  <p>Oficina de Motas - Reparação e Manutenção</p>
  <a class="btn" href="#servicos">Ver Serviços</a>
</header>

<section id="servicos">
  <h2>Serviços</h2>

  <div class="card">Reparação de Motas</div>
  <div class="card">Revisões</div>
  <div class="card">Diagnóstico</div>
  <div class="card">Performance</div>
</section>

</body>
</html>
