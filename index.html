<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOX3640 - Oficina de Motas e Bicicletas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
}

header{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,.95);
backdrop-filter:blur(10px);
z-index:1000;
border-bottom:2px solid #ff1f1f;
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
}

.logo-text{
font-size:28px;
font-weight:700;
color:#ff1f1f;
}

.menu a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:500;
}

.hero{
padding-top:120px;
text-align:center;
padding-bottom:60px;
background:linear-gradient(180deg,#111,#000);
}

.hero img{
width:90%;
max-width:850px;
margin-bottom:25px;
}

.hero h1{
font-size:3rem;
margin-bottom:15px;
}

.hero p{
font-size:1.1rem;
color:#ccc;
max-width:800px;
margin:auto;
}

.buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.btn{
padding:15px 28px;
border-radius:8px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.primary{
background:#ff1f1f;
color:white;
}

.primary:hover{
transform:translateY(-3px);
}

.secondary{
background:#25D366;
color:white;
}

section{
padding:80px 20px;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
text-align:center;
font-size:2.2rem;
margin-bottom:50px;
color:#ff1f1f;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#181818;
padding:30px;
border-radius:15px;
transition:.3s;
border:1px solid #222;
}

.card:hover{
transform:translateY(-8px);
}

.card h3{
margin-bottom:15px;
color:#ff1f1f;
}

.contact{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.contact-box{
background:#181818;
padding:30px;
border-radius:15px;
}

.contact-box a{
color:#fff;
text-decoration:none;
}

.booking{
text-align:center;
background:#111;
}

.booking h2{
margin-bottom:20px;
}

.booking-btn{
display:inline-block;
background:#ff1f1f;
padding:18px 40px;
font-size:1.1rem;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:600;
}

footer{
background:#000;
padding:30px;
text-align:center;
border-top:2px solid #ff1f1f;
}

@media(max-width:768px){

.hero h1{
font-size:2rem;
}

.menu{
display:none;
}

}

</style>
</head>
<body>

<header>
<div class="nav">
<div class="logo-text">BOX3640</div>

<div class="menu">
<a href="#servicos">Serviços</a>
<a href="#contactos">Contactos</a>
<a href="#agendamento">Agendamento</a>
</div>
</div>
